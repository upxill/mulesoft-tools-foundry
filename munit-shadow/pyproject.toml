[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "munit-shadow"
version = "0.1.0"
description = "An ambient, live agent that watches a Mule 4 project's flow XML and keeps its MUnit tests incrementally in sync, in-place, byte-preserving."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Srinivasarao Polagani" }]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
enrich = ["anthropic>=0.40.0"]
watchdog = ["watchdog>=4.0.0"]
dev = ["pytest>=7.0", "anthropic>=0.40.0", "watchdog>=4.0.0"]

[project.scripts]
munit-shadow = "munit_shadow.cli:main"

[tool.setuptools.packages.find]
include = ["munit_shadow*"]
