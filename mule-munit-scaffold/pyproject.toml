[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mule-munit-scaffold"
version = "0.1.0"
description = "Generates MUnit test skeletons (with mocks for every outbound connector call) from real Mule 4 flow XML."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Srinivasarao Polagani", email = "polaganisrinivas@gmail.com" }]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
enrich = ["anthropic>=0.40.0"]
dev = ["pytest>=8.0", "anthropic>=0.40.0"]

[project.scripts]
mule-munit-scaffold = "mule_munit_scaffold.cli:main"

[tool.setuptools.packages.find]
include = ["mule_munit_scaffold*"]
