[project]
name = "mule-to-mcp"
version = "0.1.0"
description = "Turn a RAML 1.0 or OpenAPI spec (local, URL, or pulled from Anypoint Exchange) into a runnable MCP server, with MuleSoft-flavored auth wiring (Client ID enforcement / OAuth 2.0)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Srinivasarao Polagani" }]
keywords = ["mcp", "model-context-protocol", "mulesoft", "raml", "openapi", "anypoint", "codegen", "llm-tools"]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
mule-to-mcp = "mule_to_mcp.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mule_to_mcp*"]
